# EVE-X release deployment: prebuilt :1.0.1 images, no source builds.
# Virgin-host rehearsal:
#   EVEX_AUTH_TOKEN=<strong> POSTGRES_PASSWORD=<strong> GARAGE_RPC_SECRET=<64hex> GARAGE_ADMIN_TOKEN=<64hex> \
#   docker compose -f infra/deployment/docker-compose.yml -f infra/deployment/docker-compose.release.yml -p evex-virgin up -d
# Render object-storage/garage.toml from garage.toml.template first (see
# infra/deployment/object-storage/bring-up.sh for the idempotent procedure).
name: eve-x

services:
  inference:
    build: !reset null
    image: evex-inference:${EVEX_IMAGE_TAG:-1.0.3}
  api:
    build: !reset null
    image: evex-api:${EVEX_IMAGE_TAG:-1.0.3}
  worker:
    build: !reset null
    image: evex-worker:${EVEX_IMAGE_TAG:-1.0.3}
  mcp:
    build: !reset null
    image: evex-mcp:${EVEX_IMAGE_TAG:-1.0.3}
  console:
    build: !reset null
    image: evex-console:${EVEX_IMAGE_TAG:-1.0.3}

volumes:
  garagedata-meta:
  garagedata-data:
