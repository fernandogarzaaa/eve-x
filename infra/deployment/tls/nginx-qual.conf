# TLS termination sidecar for EVE-X (production pattern: TLS at the edge,
# plain HTTP behind it on a private network). Self-signed cert here is for
# QUALIFICATION ONLY — production must mount a real certificate.
server {
    listen              8443 ssl;
    ssl_certificate     /etc/nginx/tls/evex.crt;
    ssl_certificate_key /etc/nginx/tls/evex.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # API + MCP + console + WebSocket streams, one entry point.
    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket upgrade for /v1/stream/:sessionId
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
