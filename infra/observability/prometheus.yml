global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: evex-api
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /v1/metrics
    scrape_interval: 10s

  - job_name: evex-inference
    static_configs:
      - targets: ["inference:8090"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: evex-worker
    static_configs:
      - targets: ["worker:8082"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: evex-mcp
    static_configs:
      - targets: ["mcp:8081"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
